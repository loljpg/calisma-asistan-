; DAXEN VANE – ESP32 Cheap Yellow Display (ESP32-2432S028R)
;
; İki ekran sürücüsü için derlenir:
;   cyd         : yaygın micro-USB kart (ILI9341)
;   cyd_st7789  : iki USB'li (micro-USB + USB-C) kartlar (ST7789)

[platformio]
default_envs = cyd

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags =
  -DUSER_SETUP_LOADED=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DUSE_HSPI_PORT=1
  -DSPI_FREQUENCY=55000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
  -DSMOOTH_FONT=1
  -DCORE_DEBUG_LEVEL=0
  -DDISABLE_ALL_LIBRARY_WARNINGS=1

; --- DAXEN VANE ---
[daxen]
build_src_filter = +<*>
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@^7.2.1
  h2zero/NimBLE-Arduino@^1.4.3
build_flags =
  ${env.build_flags}
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED=1

[env:cyd]
build_src_filter = ${daxen.build_src_filter}
lib_deps = ${daxen.lib_deps}
build_flags =
  ${daxen.build_flags}
  -DILI9341_2_DRIVER=1

[env:cyd_st7789]
build_src_filter = ${daxen.build_src_filter}
lib_deps = ${daxen.lib_deps}
build_flags =
  ${daxen.build_flags}
  -DST7789_DRIVER=1
  -DFW_VARIANT_ST7789=1
