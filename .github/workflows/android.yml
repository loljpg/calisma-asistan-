name: Android APK

on:
  push:
    branches: [main, "dev/**"]
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıkları kur
        run: npm install --no-audit --no-fund

      - name: Mantık testleri
        run: npm test

      - name: Sürüm numarasını yaz
        run: echo "export const BUILD = ${GITHUB_RUN_NUMBER};" > www/js/version.js

      - name: Capacitor çekirdeğini kopyala
        run: |
          mkdir -p www/vendor
          cp node_modules/@capacitor/core/dist/capacitor.js www/vendor/capacitor.js

      - name: Android projesini oluştur
        run: |
          npx cap add android
          npx cap sync android

      - name: İkonlar ve sürüm kodu
        run: |
          cp -r resources/android/res/. android/app/src/main/res/
          sed -i "s/versionCode 1$/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: İmza anahtarı
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          else
            cp keys/debug.keystore ~/.android/debug.keystore
          fi

      - name: APK derle
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "../calisma-asistani-v${GITHUB_RUN_NUMBER}.apk"

      - name: Release oluştur
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Çalışma Asistanı v${{ github.run_number }}
          make_latest: true
          body: |
            Telefona kurmak için aşağıdaki .apk dosyasını indir ve aç.
            Önceki sürüm yüklüyse üstüne kurulur, verilerin silinmez.
          files: calisma-asistani-v${{ github.run_number }}.apk
