name: DAXEN VANE yazılımı (ESP32 CYD)

on:
  push:
    branches: [main, "dev/**"]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Testler (bilgisayarda, ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Birim testleri ve bütün ekran senaryoları
        run: firmware/test/host/run.sh test

  sertifika:
    name: Güncelleme sunucularının sertifikaları
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Kök paketi (sys/ota_roots.h) certs/ota-roots.pem ile aynı mı
        run: python3 firmware/tools/make_ota_roots.py --check
      - name: GitHub'ın gerçek zincirleri kartın kökleriyle doğrulanıyor mu
        run: |
          # Kartın indirdiği dosyanın yönlendirildiği sunucu (son fw sürümünden öğrenilir)
          last=$(curl -fsS "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/fw-v" | grep -o 'refs/tags/fw-v[0-9]*' | sed 's/.*fw-v//' | sort -n | tail -n 1)
          hosts="api.github.com github.com"
          if [ -n "$last" ]; then
            loc=$(curl -sSI "https://github.com/${GITHUB_REPOSITORY}/releases/download/fw-v$last/firmware-cyd.bin" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}' | head -n 1)
            dl=$(echo "$loc" | sed -E 's#^https?://([^/]+)/.*#\1#')
            [ -n "$dl" ] || { echo "indirme sunucusu bulunamadı"; exit 1; }
            hosts="$hosts $dl"
          fi
          echo "Denenecek: $hosts"
          python3 firmware/tools/check_ota_chains.py $hosts

  build:
    needs: [test, sertifika]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: PlatformIO kur
        run: pip install --upgrade platformio "esptool<5"

      - name: Derle (ILI9341 ve ST7789)
        working-directory: firmware
        env:
          PLATFORMIO_BUILD_FLAGS: -DFW_BUILD=${{ github.run_number }}
        run: pio run -e cyd -e cyd_st7789

      - name: Dosyaları hazırla
        working-directory: firmware
        run: |
          mkdir -p ../dist
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -n 1)
          test -n "$BOOT_APP0"
          for env in cyd cyd_st7789; do
            B=.pio/build/$env
            cp "$B/firmware.bin" "../dist/firmware-$env.bin"
            esptool.py --chip esp32 merge_bin -o "../dist/ilk-kurulum-$env.bin" \
              --flash_mode dio --flash_freq 40m --flash_size 4MB \
              0x1000 "$B/bootloader.bin" 0x8000 "$B/partitions.bin" \
              0xe000 "$BOOT_APP0" 0x10000 "$B/firmware.bin"
          done
          ls -la ../dist

      - name: Yayınla
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fw-v${{ github.run_number }}
          name: DAXEN VANE fw-v${{ github.run_number }}
          make_latest: "false"
          body: |
            **İlk yükleme:** ESPFlash ile **0x0** adresine yaz.
            - Tek USB'li kart (sadece micro-USB): `ilk-kurulum-cyd.bin`
            - İki USB'li kart (micro-USB + USB-C): `ilk-kurulum-cyd_st7789.bin`

            İki ucu USB-C olan kablo iki USB'li kartta çalışmaz; micro-USB girişini ya da OTG çevirici + USB-A kablo kullan.

            Sonraki sürümler kart Wi-Fi'ye bağlıyken kendiliğinden yüklenir
            (`firmware-*.bin` dosyaları bunun içindir, elle yüklemene gerek yok).
          files: dist/*.bin
