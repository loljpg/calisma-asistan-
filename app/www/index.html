<!doctype html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F4F0">
<title>Çalışma Asistanı</title>
<script>
  // İlk boyamadan önce temayı seç (koyu temada beyaz parlama olmasın).
  try {
    const t = (JSON.parse(localStorage.getItem('calisma-asistani:v1') || '{}').settings || {}).theme || 'auto';
    if (t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
  } catch (e) {}
</script>
<link rel="stylesheet" href="css/app.css">
<script src="vendor/capacitor.js"></script>
</head>
<body>
<main id="view" tabindex="-1"></main>
<nav id="tabbar" class="tabbar surface" aria-label="Ana menü"></nav>
<script type="module" src="js/app.js"></script>
</body>
</html>
